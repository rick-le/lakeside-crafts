<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart | Lakeside Crafts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="cart">
  <header id="site-header"></header>

  <main class="container">
    <h2>Your shopping cart</h2>
    <div class="cart-layout">
      <div id="cart-items"></div>

      <aside class="summary" id="summary">
        <h3>Order summary</h3>
        <div class="row"><span>Subtotal</span><span id="subtotal">KSh 0</span></div>
        <div class="row"><span>Delivery</span><span id="delivery">KSh 0</span></div>
        <div class="row total"><span>Total</span><span id="total">KSh 0</span></div>

        <form id="checkout-form" novalidate>
          <label>Full name<input id="c-name" type="text" placeholder="Jane Achieng"></label>
          <label>M-Pesa number<input id="c-phone" type="tel" placeholder="0712345678"></label>
          <label>Delivery town<input id="c-town" type="text" placeholder="Kisumu"></label>
          <p id="c-error" class="error" hidden></p>
          <button class="btn full" type="submit">Pay with M-Pesa</button>
        </form>
        <p class="muted small">Demo checkout: no real payment is made.</p>
      </aside>
    </div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" id="modal-box"></div>
  </div>

  <footer id="site-footer"></footer>
  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body>
</html>
